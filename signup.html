<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your VELTRION account — VELTRION</title><link rel="stylesheet" href="assets/styles.css"></head><body data-auth-page="signup"><header class="nav"><a class="brand" href="index.html"><img src="assets/veltrion-logo.svg" alt="VELTRION"></a><a class="text-link" href="index.html">← Back to overview</a></header><main class="wrap"><form class="form-shell" id="authForm" novalidate><div class="eyebrow">VELTRION ACCOUNT</div><h1>Create your VELTRION account</h1><p>Set up your profile to explore the account experience.</p><div class="notice">Create your VELTRION account. Email confirmation may be required before sign-in.</div><div id="authMessage" class="notice" role="status" aria-live="polite" hidden></div><label class="field"><span>Full name</span><input name="displayName" required autocomplete="name" placeholder="Your full name"></label><label class="field"><span>Email address</span><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label class="field"><span>Password</span><input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn btn-gold" type="submit">Create account ↗</button><p class="form-note">Already have an account? <a class="text-link" href="login.html">Log in</a></p></form></main><footer class="wrap footer-bottom"><span>© 2026 VELTRION · Preview build</span><a href="security.html">Security & privacy</a></footer><div class="toast" id="toast"></div><script type="module" src="assets/auth.js"></script></body></html>
